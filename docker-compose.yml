version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: leadflow_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - leadflow_net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadflow_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/leadflow
      - JWT_SECRET=your_super_secret_jwt_key
      - SESSION_SECRET=your_session_secret
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_APP_PASSWORD=your_gmail_app_password
    depends_on:
      - mongodb
    networks:
      - leadflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leadflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - leadflow_net

volumes:
  mongodb_data:

networks:
  leadflow_net:
    driver: bridge
